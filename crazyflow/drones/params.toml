# Core physical parameters shared by all dynamics and the simulator. Every section is a drone
# configuration and must define exactly these parameters:
#
# [my_drone]
# gravity_vec = [0.0, 0.0, -9.81]  # m/s^2
# mass = 0.1                       # kg
# J = [                            # kg m^2. Must be invertible. The fitted so_rpy models only use
#     [1.0e-5, 0.0, 0.0],          # it to apply external torques, so an approximate value works
#     [0.0, 1.0e-5, 0.0],          # for them, but disturbance torques are then off.
#     [0.0, 0.0, 2.0e-5]
# ]
# thrust_min = 0.0                 # N per motor
# thrust_max = 1.0                 # N per motor
#
# Everything else, including platform data such as PWM limits and motor curves, lives in the params.toml
# of the dynamics that uses it, e.g. crazyflow/dynamics/first_principles/params.toml.

[cf2x_L250]
