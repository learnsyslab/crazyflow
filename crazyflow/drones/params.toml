mass = 0.0319
J = [  # TODO
    [16.8e-6, 0.0, 0.0],
    [0.0, 16.8e-6, 0.0],
    [0.0, 0.0, 29.8e-6]
]
thrust_min = 0.012817578393224994  # in N per motor
thrust_max = 0.12  # in N per motor


