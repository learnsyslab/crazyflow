package:
  name: cffirmware
  version: 0.1.0

source:
  git: https://github.com/bitcraze/crazyflie-firmware.git
  rev: f45ff8fdce4e73e5ce88ec06eee76309d2fa9a39

build:
  script:
    - make cf2_defconfig
    - env -u CFLAGS -u LDFLAGS make bindings_python
    - cp build/cffirmware.py build/_cffirmware*.so $SP_DIR/

requirements:
  build:
    - ${{ compiler('c') }}
    - make
    - swig
  host:
    - python
    - setuptools
  run:
    - python
    - numpy
