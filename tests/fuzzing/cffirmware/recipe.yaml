package:
  name: cffirmware
  version: 0.1.0

source:
  - path: .
  - git: https://github.com/bitcraze/crazyflie-firmware.git
    rev: f45ff8fdce4e73e5ce88ec06eee76309d2fa9a39
    target_directory: firmware

build:
  script:
    - cmake -S . -B build -G Ninja -DCF_FIRMWARE=$SRC_DIR/firmware
    - cmake --build build
    - cp build/mellinger_fuzz_oracle*.so $SP_DIR/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - python
    - pybind11
  run:
    - python
