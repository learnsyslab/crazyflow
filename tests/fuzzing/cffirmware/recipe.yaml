package:
  name: cffirmware
  version: 0.1.0

source:
  git: https://github.com/bitcraze/crazyflie-firmware.git
  rev: d794c5ca081d19aa1e1bbcb6fd4a3711784fb8b1

build:
  script:
    - make cf2_defconfig
    - env -u CFLAGS -u LDFLAGS make bindings_python
    - cp build/cffirmware.py build/_cffirmware*.so $SP_DIR/

requirements:
  build:
    - ${{ compiler('c') }}
    - make
    - swig
  host:
    - python
    - setuptools
  run:
    - python
    - numpy
